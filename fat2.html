<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지방 퀴즈 배틀 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EAF1EE; --surface:#FFFFFF; --ink:#1D2927; --muted:#5C6E6A; --line:#CCDAD5;
  --accent:#2C7668; --accent-deep:#123F38; --accent-soft:#DCEBE6;
  --ok:#2B7A4B; --ok-soft:#E1F1E6; --no:#B2452E; --no-soft:#F8E4DF;
  --gold:#E2A81F; --gold-soft:#FBF0D2; --silver:#8A9AA0; --bronze:#B9774A;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
body.stage{background:var(--accent-deep);color:#F2F7F5}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:1240px}
h1{font-family:var(--display);font-size:clamp(26px,5vw,36px);line-height:1.3;margin:2px 0 0;text-wrap:balance}
.unit{font-size:13px;color:var(--muted);letter-spacing:.03em}
.stage .unit{color:#A9C7BF}
.card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.meta{font-size:14px;color:var(--muted);margin:0}
label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input.code{font-size:28px;font-weight:700;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.row.between{justify-content:space-between}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff;min-height:48px}
.btn.big{font-size:19px;padding:14px 30px;min-height:58px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2B2005}
.btn.ghost{background:transparent;color:var(--accent)}
.stage .btn.ghost{color:#D7E9E4;border-color:#6E9D92}
.btn:disabled{opacity:.45;cursor:default}
.link{font:inherit;background:none;border:0;padding:6px;color:var(--accent);text-decoration:underline;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--no);font-size:14px;margin:0;font-weight:500}
.banner{background:var(--gold-soft);border:1px solid var(--gold);color:#5A4408;border-radius:10px;padding:10px 14px;font-size:14px}
.big-num{font-variant-numeric:tabular-nums}

/* 학생: 문제 */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600}
.chip.hot{background:var(--gold-soft);border-color:var(--gold);color:#5A4408}
.spacer{flex:1}
.timer{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%;border-radius:5px}
.timer.low i{background:var(--no)}
.qnum{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px}
.prompt{font-size:18px;font-weight:500;margin:0;text-wrap:pretty}
.source{font-family:var(--display);font-size:19px;background:var(--accent-soft);border-radius:8px;padding:12px 16px;line-height:1.7}
.source u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.mk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)} .opt.no .mk{background:var(--no);border-color:var(--no);color:#fff}
.fb{border-radius:10px;padding:14px 16px;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--no-soft)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--no)}
.pts{font-family:var(--display);font-weight:700;font-size:22px}

.tmrow{display:flex;align-items:center;gap:10px}
.tmrow .timer{flex:1}
.tmrow b{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.passage{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.7}
.passage summary{cursor:pointer;font-weight:600;color:var(--accent)}
.passage .body{max-height:38vh;overflow-y:auto;margin-top:8px;padding-right:6px}
.passage p{margin:0 0 10px}
.passage u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--accent)}
.source.bogi{font-family:var(--body);font-size:15px}

/* 순위 */
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.mini li.me{background:var(--accent-soft);font-weight:600}
.mini .r{width:30px;font-weight:700;color:var(--accent)}
.mini .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-hero{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.rank-hero small{font-size:24px;color:var(--muted)}
.winner{background:var(--gold-soft);border:2px solid var(--gold)}
.winner .rank-hero{color:#8A6508}

/* 교사 화면 */
.stage h1{color:#fff}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.join-code{font-size:clamp(64px,10vw,112px);font-weight:700;letter-spacing:.12em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.qr{width:min(100%,52vh,460px);aspect-ratio:1;align-self:center}
.qr svg,.qr img{width:100%;height:100%;display:block}
.url{font-size:13px;word-break:break-all;color:var(--muted);margin:0}
.names{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.names button{font:inherit;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.names button:hover{border-color:var(--no);text-decoration:line-through}
.board{position:relative;display:grid;gap:8px;grid-auto-flow:column;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))}
.line{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;min-width:0;font-variant-numeric:tabular-nums}
.line .r{width:36px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);flex:none}
.line .n{flex:0 1 auto;min-width:0;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .p{flex:1;min-width:30px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.line .p i{display:block;height:100%;background:var(--accent);transition:width .4s}
.line .s{font-weight:700;font-size:20px;flex:none}
.line.top1{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)}
.line.top1 .r{color:#8A6508}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.pod .who{font-size:clamp(18px,3vw,30px);font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.pod .sc{font-size:15px;color:#BFD8D1;font-variant-numeric:tabular-nums}
.pod .block{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,54px);color:#fff}
.pod.p1 .block{height:190px;background:var(--gold);color:#2B2005}
.pod.p2 .block{height:130px;background:var(--silver)}
.pod.p3 .block{height:90px;background:var(--bronze)}
.prize{font-size:15px;font-weight:600;background:var(--gold);color:#2B2005;padding:3px 12px;border-radius:999px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.card h2{font-family:var(--display);font-size:20px;margin:0}
.ia{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ia .t{font-size:14px;display:flex;justify-content:space-between;gap:12px}
.ia .t span:first-child{min-width:0}
.ia .t b{font-variant-numeric:tabular-nums;flex:none}
.ia .b{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:3px}
.ia .b i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-size:13px;color:var(--muted);font-weight:500}
.tbl td.num,.tbl th.num{text-align:right}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){.line .p i{transition:none}}
</style>
</head>

<script>
/* ===== 설정: Firebase 콘솔의 firebaseConfig 값을 null 자리에 붙여 넣으세요. =====
   null이면 체험 모드입니다(같은 브라우저의 탭끼리만 연결). */

};

const TITLE = "부드럽고 고소한 지방의 두 얼굴 형성평가 2";
const UNIT = "3. 다양한 분야의 글 읽고 쓰기 · (3) 과학·기술 분야의 글 읽기와 쓰기";
const limitOf = k => (Q[k].t||30)*1000;   // 문항별 제한 시간
const QUIZ_ID = "fat2";     // 같은 Firebase를 쓰는 다른 퀴즈와 구분

/* 문항을 고칠 때는 p(발문), s(제시문, 없어도 됨), o(보기), a(정답 번호, 0부터), e(해설)를 바꾸세요.
   문항 수를 바꾸면 database.rules.json의 answered 상한(10)과 score 상한도 함께 바꿉니다. */
const P1=`<p>(가) 현대인의 중요한 관심사 중 하나는 건강과 다이어트이다. 흔히 우리는 음식물에 포함된 지방을 몸에 좋지 않은 ‘나쁜 성분’으로 <u>㉠치부하고는</u> 한다. 물론 과도하게 섭취한 지방, 특히 몸에 좋지 않은 지방은 비만의 원인이 되고 당뇨병, 심장병, 고혈압과 같은 각종 성인병을 유발한다. 그러나 지방은 우리 몸이 정상적으로 활동하는 데 필수적인 성분이기도 하다. 그렇다면 지방에는 어떤 종류가 있고 또 지방은 우리 몸에서 어떤 기능을 수행하는 것일까?</p>
<p>(나) 지방은 지방산에 따라 구분된다. [그림 1]을 보면 지방은 마치 다리가 세 개 달린 낙지 모양과 유사하다. 머리처럼 보이는 부분을 글리세롤이라고 하고, 세 개의 다리처럼 보이는 부분을 지방산이라고 한다. 즉, 지방은 글리세롤 한 개에 세 개의 지방산이 연결된 구조이다. 글리세롤의 모양은 항상 같지만, 지방산의 모양은 지방의 종류에 따라 차이가 있다. 지방산은 탄소가 길게 연결되어 있고 그 주위를 수소 원자들이 둘러싸고 있는데, 지방산의 종류에 따라 탄소와 탄소 사이의 결합 유형과 수소 원자의 개수가 다르다.</p>
<p>(다) 지방산은 포화 지방산과 불포화 지방산으로 구분되며, 이에 따라 지방도 포화 지방산만으로 이루어진 포화 지방과 불포화 지방산을 지닌 불포화 지방으로 구분된다. 포화는 모든 수소 원자의 자리가 꽉 찼다는 의미이고, 불포화는 수소 원자의 자리가 덜 찼다는 의미이다. 포화 지방산은 [그림 2]의 (가)와 같이 모든 탄소와 탄소 사이의 결합이 단일 결합이고, 모든 탄소에 각각 두 개의 수소 원자가 붙어 있어 빈자리가 없다. 이와 달리 불포화 지방산은 [그림 2]의 (나)와 같이 탄소 사이에 하나 이상의 이중 결합이 있고, 수소 원자가 붙어 있지 않은 빈자리가 있다.</p>
<p>(라) 포화 지방산은 버터나 비계처럼 고체 상태의 지방에 많고, 불포화 지방산은 식물성 기름처럼 액체 상태의 지방에 많다. 그 이유는 두 가지 지방산의 화학 구조가 다르기 때문이다. [그림 2]를 보면, (가)의 포화 지방산은 일자형의 막대 형태인 반면, (나)의 불포화 지방산은 이중 결합이 있는 곳이 꺾여 있는 막대 형태이다. 반듯한 막대 형태는 차곡차곡 쌓기가 쉬워서 구조가 단단한 고체가 되지만, 꺾인 막대 형태는 차곡차곡 쌓기가 어렵기 때문에 구조가 느슨한 액체가 된다. 포화 지방산은 불포화 지방산과 달리 심혈관 질환, 당뇨병, 암 등의 발생에 영향을 주는 것으로 알려져 있다.</p>
<p>(마) [그림 2]의 (나)와 같은 불포화 지방산은 시스 지방산으로 불리는데, 시스 지방산을 인위적으로 조작하면 트랜스 지방산이 만들어질 수 있다. 가령 식물성 기름에 높은 온도를 가해 튀기면 식물성 기름의 시스 지방산의 구조가 변형되어 트랜스 지방산이 된다. 트랜스 지방산은 보통 자연적으로는 만들어지지 않아 자연 상태에서는 극소의 양만 존재한다. 트랜스 지방산은 불포화 지방산이지만 시스 지방산과 달리 [그림 2]의 (가)와 비슷하게 막대 형태를 띤다. 이에 따라 트랜스 지방산은 쉽게 고체 상태가 되기 때문에 포화 지방산과 마찬가지로 건강에 좋지 않은 영향을 끼친다. 트랜스 지방산은 튀기거나 가공 과정을 거치는 케이크, 마가린, 쿠키, 도넛, 감자튀김, 피자 등에 주로 포함되어 있다.</p>`;
const P2=`<p>[그림 2]의 (나)와 같은 불포화 지방산은 시스 지방산으로 불리는데, 시스 지방산을 인위적으로 조작하면 트랜스 지방산이 만들어질 수 있다. 가령 식물성 기름에 높은 온도를 가해 튀기면 식물성 기름의 시스 지방산의 구조가 변형되어 트랜스 지방산이 된다. 트랜스 지방산은 보통 자연적으로는 만들어지지 않아 자연 상태에서는 극소의 양만 존재한다. 트랜스 지방산은 불포화 지방산이지만 시스 지방산과 달리 [그림 2]의 (가)와 비슷하게 막대 형태를 띤다. 이에 따라 트랜스 지방산은 쉽게 고체 상태가 되기 때문에 포화 지방산과 마찬가지로 건강에 좋지 않은 영향을 끼친다. 트랜스 지방산은 튀기거나 가공 과정을 거치는 케이크, 마가린, 쿠키, 도넛, 감자튀김, 피자 등에 주로 포함되어 있다.</p>

function loadScript(src){
  return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("script"));document.head.append(s);});
}
async function firebaseStore(){

  await loadScript(base+"firebase-database-compat.js");
  // 일부 학교망에서 막히는 분산 서버 주소가 저장되어 있으면 지워 기본 주소로 접속
  try{

    localStorage.removeItem("firebase:previous_websocket_failure");
  }catch{}
  firebase.initializeApp(FIREBASE_CONFIG);
  const cred=await firebase.auth().signInAnonymously();
  const db=firebase.database();
  return {
    uid:cred.user.uid,
    onConn:cb=>db.ref(".info/connected").on("value",s=>cb(!!s.val())),
    get:p=>db.ref(p).get().then(s=>s.val()),

    set:(p,v)=>db.ref(p).set(v),
    update:(p,v)=>db.ref(p).update(v),
    remove:p=>db.ref(p).remove()
  };
}

  return {
    uid,
    get:p=>Promise.resolve(at(read(),p)),
    on(p,cb){const s={p,cb};subs.add(s);setTimeout(()=>subs.has(s)&&cb(at(read(),p)),0);return()=>subs.delete(s);},
    set:(p,v)=>write(p,()=>v),
    update:(p,v)=>write(p,o=>({...(o||{}),...v})),
    remove:p=>write(p,()=>null)
  };
}

const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>s.replace(/<[^>]+>/g,"");
const $=id=>document.getElementById(id);
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function shuffled(n,seed){ // 학생마다 같은 순서를 유지하도록 시드 사용
  const a=[...Array(n).keys()];let x=hash(seed)||1;
  for(let i=n-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function ranked(room){
  return Object.entries(room?.players||{}).map(([uid,p])=>({uid,...p}))
    .sort((a,b)=>(b.score||0)-(a.score||0)||(a.totalMs||0)-(b.totalMs||0)||String(a.sid).localeCompare(String(b.sid)));
}
const fmt=n=>(n||0).toLocaleString("ko-KR");
const secs=ms=>((ms||0)/1000).toFixed(1)+"초";
const label=p=>p.name||p.sid||"이름 없음";

function leave(){if(unsub){unsub();unsub=null;}clearInterval(timerId);hostLines.clear();fb=null;}

/* ===== 학생 ===== */
let code="",room=null,me=null,fb=null,timerId=0,qAtLocal=0,submitting=false;
async function join(){
  const c=$("code").value.trim(),sid=$("sid").value.trim(),name=$("nm").value.trim(),err=$("err");
  if(!/^\d{4}$/.test(c)){err.textContent="참가 코드 4자리를 입력해 주세요.";return;}
  if(!sid||!name){err.textContent="학번과 이름을 모두 입력해 주세요.";return;}
  err.textContent="";$("go").disabled=true;
  try{
    const r=await timed(store.get("rooms/"+c));
    if(!r)throw new Error("없는 참가 코드입니다. 다시 확인해 주세요.");
    if(r.quiz!==QUIZ_ID)throw new Error("다른 퀴즈의 참가 코드입니다. 선생님 화면의 QR로 다시 들어와 주세요.");
    const mine=r.players?.[store.uid];
    if(!mine){
      if(r.phase==="ended")throw new Error("이미 끝난 게임입니다.");
      if(Object.values(r.players||{}).some(p=>String(p.sid)===sid))throw new Error("이미 참가한 학번입니다. 잘못 들어갔다면 선생님께 말씀해 주세요.");
      await timed(store.set(`rooms/${c}/players/${store.uid}`,{sid,name,score:0,answered:0,correct:0,streak:0,totalMs:0}));
    }
    enterRoom(c);
  }catch(e){
    err.textContent=e.message&&/[가-힣]/.test(e.message)?e.message:"연결에 실패했습니다. 인터넷을 확인하고 다시 시도해 주세요.";
    $("go").disabled=false;
  }
}
function enterRoom(c){
  leave();code=c;
  try{playerStorage().setItem("quizbattle-fat2-player",c);}catch{}
  let seen=false;
  unsub=store.on("rooms/"+c,r=>{
    room=r;
    if(!r)return home("선생님이 게임을 닫았습니다.");
    me=r.players?.[store.uid]||null;
    if(!me){if(seen||r.phase==="ended")return home("게임에서 나왔습니다. 다시 참가하려면 선생님께 말씀해 주세요.");return home();}
    seen=true;route();
  });
}
function route(){
  const n=Q.length;
  if(room.phase==="lobby")return screen==="lobby"?patchLobby():lobbyView();
  if(room.phase==="ended")return screen==="end"?patchEnd():endView();
  if(fb&&fb.idx===me.answered-1)return screen==="fb"+fb.idx?patchHud():fbView();
  if(me.answered<n)return screen==="q"+me.answered?patchHud():questionView(me.answered);
  return screen==="done"?patchDone():doneView();
}
const myRank=()=>ranked(room).findIndex(p=>p.uid===store.uid)+1;
const total=()=>Object.keys(room.players||{}).length;
function hud(){
  const st=me.streak||0;
  return `<div class="hud" id="hud"><span class="chip">${myRank()}위 / ${total()}명</span><span class="chip">${fmt(me.score)}점</span>${st>=2?`<span class="chip hot">${st}연속 정답</span>`:""}<span class="spacer"></span><span>${Math.min(me.answered+(screen.startsWith("q")?1:0),Q.length)} / ${Q.length}</span></div>`;
}
function patchHud(){const h=$("hud");if(h)h.outerHTML=hud();}
function lobbyView(){
  show("lobby",`<header><div class="unit">${esc(UNIT)}</div><h1>곧 시작합니다</h1></header>
  <main class="card"><p style="margin:0;font-size:18px"><b>${esc(me.name)}</b> 님, 입장했습니다.</p>
  <p class="meta">선생님이 시작하면 문제가 나옵니다. 정답을 빨리 맞힐수록, 연속으로 맞힐수록 점수가 높습니다. 문항마다 제한 시간은 30초~1분입니다.</p>
  <div id="lobbyInfo"></div></main>`);
  patchLobby();
}
function patchLobby(){const el=$("lobbyInfo");if(el)el.innerHTML=`<p style="margin:0;font-weight:600">현재 ${total()}명 참가${room.prize?` · 1등 상품: ${esc(room.prize)}`:""}</p>`;}
function questionOrder(){return shuffled(Q.length,store.uid+":"+code);}
const optOrder=k=>Q[k].fix?Q[k].o.map((_,i)=>i):shuffled(Q[k].o.length,store.uid+":"+k);
const qBody=(q,open)=>`<details class="passage"${open?" open":""}><summary>지문 보기</summary><div class="body">${q.s}</div></details><p class="prompt">${q.p}</p>${q.b?`<div class="source bogi">${q.b}</div>`:""}`;
function questionView(idx){
  clearInterval(timerId);submitting=false;
  const k=questionOrder()[idx],q=Q[k],order=optOrder(k);
  screen="q"+idx;
  show("q"+idx,`${hud()}<div class="tmrow"><div class="timer" id="tm"><i id="tmf"></i></div><b id="tms"></b></div>
  <main class="card"><div class="qnum">${idx+1}번째 문제</div>${qBody(q,screen[0]==="q")}
  <ul class="opts">${order.map((o,i)=>`<li><button class="opt" data-o="${o}"><span class="mk">${i+1}</span><span>${esc(q.o[o])}</span></button></li>`).join("")}</ul></main>`);
  // 새로고침으로 시간을 되돌리지 못하도록 시작 시각을 저장
  if(me.qi===idx&&me.qAt)qAtLocal=me.qAt;
  else{qAtLocal=Date.now();store.update(`rooms/${code}/players/${store.uid}`,{qi:idx,qAt:qAtLocal}).catch(()=>{});}
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(idx,k,+b.dataset.o));
  const tick=()=>{
    const left=Math.max(0,limitOf(k)-(Date.now()-qAtLocal));
    const f=$("tmf");if(!f)return clearInterval(timerId);
    f.style.width=left/limitOf(k)*100+"%";$("tm").classList.toggle("low",left<8000);$("tms").textContent=Math.ceil(left/1000)+"초";
    if(left<=0)answer(idx,k,-1);
  };
  tick();timerId=setInterval(tick,200);
}
async function answer(idx,k,choice){
  if(submitting)return;submitting=true;clearInterval(timerId);
  app.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  const q=Q[k],ok=choice===q.a,used=Math.min(limitOf(k),Date.now()-qAtLocal);
  const streak=ok?(me.streak||0)+1:0;
  const gain=ok?500+Math.round(500*(1-used/limitOf(k)))+Math.min(streak-1,3)*100:0;
  const next={score:(me.score||0)+gain,answered:idx+1,correct:(me.correct||0)+(ok?1:0),streak,totalMs:(me.totalMs||0)+used,
    ans:{...(me.ans||{}),["q"+k]:ok?1:0},qAt:null,qi:null};
  fb={idx,k,choice,ok,gain,streak};
  try{
    await store.update(`rooms/${code}/players/${store.uid}`,next);
    // 체험 저장소는 알림이 비동기이므로 화면은 구독 콜백이 갱신
  }catch{
    fb=null;submitting=false;
    if(room.phase==="ended")return;
    alert("답을 저장하지 못했습니다. 인터넷을 확인한 뒤 다시 눌러 주세요.");
    app.querySelectorAll(".opt").forEach(b=>b.disabled=false);
    timerId=setInterval(()=>{if(!submitting&&Date.now()-qAtLocal>limitOf(k))answer(idx,k,-1);},500);
  }
}
function fbView(){
  const {idx,k,choice,ok,gain,streak}=fb,q=Q[k],order=optOrder(k);
  const pos=order.indexOf(q.a)+1;
  const head=ok?`정답입니다. +${fmt(gain)}점${streak>=2?` (${streak}연속)`:""}`:choice<0?`시간이 지났습니다. 정답은 ${pos}번입니다.`:`아쉬워요. 정답은 ${pos}번입니다.`;
  screen="fb"+idx;
  show("fb"+idx,`${hud()}<main class="card"><div class="qnum">${idx+1}번째 문제</div>${qBody(q,screen[0]==="q")}
  <ul class="opts">${order.map((o,i)=>`<li><button class="opt ${o===q.a?"ok":o===choice?"no":""}" disabled><span class="mk">${i+1}</span><span>${esc(q.o[o])}</span></button></li>`).join("")}</ul>
  <div class="fb ${ok?"ok":"no"}"><strong>${head}</strong>${esc(q.e)}</div>
  <div class="row"><button class="btn big" id="nx">${idx+1<Q.length?"다음 문제":"결과 보기"}</button></div></main>`);
  const nx=$("nx");nx.focus();nx.onclick=()=>{fb=null;route();};
}
function miniBoard(limit){
  const list=ranked(room),i=list.findIndex(p=>p.uid===store.uid);

}
function doneView(){

  <div class="rank-hero" id="dr"></div><p class="meta" id="dm"></p><div id="db"></div>
  <p class="meta">선생님이 결과를 발표할 때까지 순위는 계속 바뀔 수 있습니다.</p></main>`);

function patchDone(){

  <div id="eb"></div></main>${reviewHtml()}`);

function patchEnd(){const b=$("eb");if(b)b.innerHTML=miniBoard(5);}
function reviewHtml(){

}

const hostLines=new Map();

const PUBLIC_URL="https://kimbean0324-ops.github.io/hunmin_quiz/fat2.html"; // QR에는 항상 공개 주소를 넣음

function patchBoard(){
  const list=ranked(room),board=$("board");
  const done=list.filter(p=>(p.answered||0)>=Q.length).length;
  $("prog").textContent=`완료 ${done} / ${list.length}명`;

  const before=new Map();hostLines.forEach((el,u)=>before.set(u,el.getBoundingClientRect()));
  list.forEach((p,i)=>{
    let el=hostLines.get(p.uid);

  });

function hostEnd(){
  const list=ranked(room),[a,b,c]=list;
  const pod=(p,n)=>p?`<div class="pod p${n}">${n===1&&room.prize?`<span class="prize">${esc(room.prize)}</span>`:""}<div class="who">${esc(label(p))}</div><div class="sc">${fmt(p.score)}점 · ${p.correct||0}/${Q.length}</div><div class="block">${n}</div></div>`:`<div class="pod p${n}"></div>`;
  const stats=Q.map((q,k)=>{
    const got=list.filter(p=>p.ans&&p.ans["q"+k]!==undefined),right=got.filter(p=>p.ans["q"+k]===1).length;
    return {k,q,n:got.length,rate:got.length?right/got.length:0};
  }).sort((x,y)=>x.rate-y.rate);
  show("h-end",`<header class="row between"><div><div class="unit">${esc(TITLE)}</div><h1>최종 순위</h1></div>
  <div class="row"><button class="btn ghost" id="csv">결과 CSV 저장</button><button class="btn ghost" id="del">게임 닫고 데이터 삭제</button></div></header>
  <section class="podium">${pod(b,2)}${pod(a,1)}${pod(c,3)}</section>
  <div class="split"><section class="card"><h2>전체 순위</h2><table class="tbl"><thead><tr><th>순위</th><th>이름</th><th class="num">점수</th><th class="num">정답</th><th class="num">풀이 시간</th></tr></thead>
  <tbody>${list.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(label(p))}</td><td class="num">${fmt(p.score)}</td><td class="num">${p.correct||0}/${Q.length}</td><td class="num">${secs(p.totalMs)}</td></tr>`).join("")}</tbody></table></section>
  <section class="card"><h2>문항별 정답률 (낮은 순)</h2><p class="meta">정답률이 낮은 문항부터 다시 설명해 주세요.</p>
  <ul class="ia">${stats.map(s=>`<li><div class="t"><span>${s.k+1}번 · ${esc(strip(s.q.p))}</span><b>${Math.round(s.rate*100)}%</b></div><div class="b"><i style="width:${s.rate*100}%"></i></div></li>`).join("")}</ul></section></div>`,true,true);
  $("csv").onclick=()=>downloadCsv(list);
  $("del").onclick=async()=>{
    if(!confirm("이 게임의 학생 이름과 점수를 모두 삭제합니다. CSV를 저장하셨나요?"))return;
    try{localStorage.removeItem("quizbattle-fat2-host");}catch{}
    await store.remove("rooms/"+code);
  };
  confetti();
}
function downloadCsv(list){
  const cell=v=>{let s=String(v??"");if(/^[=+\-@]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`;};
  const rows=[["순위","학번","이름","점수","정답 수","풀이 시간(초)",...Q.map((_,k)=>`${k+1}번`)]];
  list.forEach((p,i)=>rows.push([i+1,p.sid,p.name,p.score||0,p.correct||0,((p.totalMs||0)/1000).toFixed(1),...Q.map((_,k)=>{const v=p.ans?.["q"+k];return v===1?"O":v===0?"X":"";})]));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+rows.map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download=`퀴즈배틀_${code}.csv`;a.click();URL.revokeObjectURL(a.href);
}

/* ===== 축하 효과 ===== */
let confettiId=0;
function stopConfetti(){cancelAnimationFrame(confettiId);confettiId=0;const c=$("confetti");if(c)c.hidden=true;}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=$("confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const colors=["#E2A81F","#2C7668","#B2452E","#8FD3C4","#FFFFFF"];
  const bits=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,w:6+Math.random()*7,h:4+Math.random()*5,v:2+Math.random()*3.5,d:Math.random()*6,col:colors[Math.floor(Math.random()*colors.length)]}));
  const t0=performance.now();
  const step=t=>{
    x.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{b.y+=b.v;b.x+=Math.sin(b.d+b.y/40);x.fillStyle=b.col;x.fillRect(b.x,b.y,b.w,b.h);});
    if(t-t0<6000)confettiId=requestAnimationFrame(step);else stopConfetti();
  };
  confettiId=requestAnimationFrame(step);
}

/* ===== 시작 ===== */
(async()=>{
  app.innerHTML=`<p class="meta">연결 중…</p>`;
  try{store=DEMO?demoStore():await firebaseStore();}
  catch{app.innerHTML=`<div class="card"><p class="err">서버에 연결하지 못했습니다. 인터넷을 확인하고 새로고침해 주세요.</p><p class="meta">이 메시지가 계속 나오면 선생님께 알려 주세요. 익명 로그인이 꺼져 있거나 Firebase 설정이 잘못되었을 수 있습니다.</p></div>`;return;}
  if(store.onConn){ // 연결이 끊기면 알림
    const note=document.createElement("div");
    note.className="banner";note.hidden=true;
    note.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:6";
    note.textContent="서버 연결이 끊겼습니다. 다시 연결하는 중입니다. 계속되면 새로고침해 주세요.";
    document.body.append(note);
    let t=0;
    store.onConn(on=>{clearTimeout(t);if(on)note.hidden=true;else t=setTimeout(()=>{note.hidden=false;},4000);});
  }
  const saved=playerSaved();
  if(saved&&(!roomFromUrl()||roomFromUrl()===saved)){
    const r=await timed(store.get("rooms/"+saved)).catch(()=>null);
    if(r?.players?.[store.uid])return enterRoom(saved);
  }
  home();
})();
